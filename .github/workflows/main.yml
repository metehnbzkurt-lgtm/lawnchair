name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project
        run: |
          if [ -f launcher-nova-edition.zip ]; then
            unzip -o launcher-nova-edition.zip
            rm launcher-nova-edition.zip
          fi
          ls -la
          echo "--- app/build.gradle var mi? ---"
          ls -la app/ || echo "app yok"

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-launcher-apk
          path: app/build/outputs/apk/debug/*.apk
