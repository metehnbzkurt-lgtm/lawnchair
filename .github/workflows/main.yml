name: Build Lawnchair APK

on:
  push:
    branches: [ main, 14 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: chmod +x ./gradlew && ./gradlew assembleLawnchairDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-nova-apk
          path: |
            **/build/outputs/apk/**/lawnchair*.apk
            **/build/outputs/apk/debug/*.apk
